{% extends 'admin/base_site.html' %}
{% load i18n %}

{% block content %}
<div class="flex flex-col gap-6">

  <div class="flex items-center gap-3 flex-wrap">
    <a href="/admin/"
       class="font-medium inline-flex items-center gap-1 rounded-default whitespace-nowrap px-3 py-1.5 text-sm border border-base-200 bg-white shadow-xs text-important dark:border-base-700 dark:bg-transparent hover:bg-base-100/80 dark:hover:bg-base-800/80">
      <span class="material-symbols-outlined text-sm -ml-0.5">arrow_back</span>
      {% trans "Dashboard" %}
    </a>
    <h1 class="text-xl font-bold text-font-important-light dark:text-font-important-dark m-0">{% trans "Dine-in QR Codes" %}</h1>
  </div>

  <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-4">
    {% for table in tables %}
    <div class="flex flex-col items-center bg-white dark:bg-base-900 border border-base-200 dark:border-base-800 rounded-default shadow-xs p-5 text-center">
      <p class="font-semibold text-sm text-font-important-light dark:text-font-important-dark mb-3">{% trans "Table" %} {{ table.number }}</p>

      <div class="w-40 aspect-square bg-white p-2 rounded-default border border-base-200">
        <img src="data:image/png;base64,{{ table.qr_b64 }}" alt="{% trans 'Table' %} {{ table.number }} QR" class="w-full h-full">
      </div>

      <p class="text-xs text-font-subtle-light dark:text-font-subtle-dark mt-3 mb-4 truncate w-full" title="{{ table.url }}">{{ table.url }}</p>

      <a href="/admin/table-qr/{{ table.number }}/"
         class="w-full font-medium inline-flex items-center justify-center gap-1 rounded-default whitespace-nowrap px-3 py-2 text-sm border border-base-200 bg-primary-600 border-transparent text-white hover:bg-primary-600/80">
        <span class="material-symbols-outlined text-sm -ml-0.5">download</span>
        {% trans "Download PNG" %}
      </a>
    </div>
    {% endfor %}
  </div>

</div>
{% endblock %}
