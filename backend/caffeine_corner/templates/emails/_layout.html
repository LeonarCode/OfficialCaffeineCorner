{% comment %}
  The frame every email shares: the brand header, a white card for the message,
  and the shop's details underneath. Tables and inline styles on purpose — that is
  what mail apps (Gmail, Outlook) render reliably; classes and <style> often get stripped.
  Blocks: preheader (the grey preview text next to the subject in an inbox), content.
{% endcomment %}<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ subject }}</title>
</head>
<body style="margin:0;padding:0;background:#FAF6F0;">
  <div style="display:none;max-height:0;overflow:hidden;opacity:0;color:#FAF6F0;">{% block preheader %}{% endblock %}</div>
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#FAF6F0;padding:24px 12px;">
    <tr>
      <td align="center">
        <table role="presentation" width="600" cellpadding="0" cellspacing="0" style="width:100%;max-width:600px;font-family:Arial,Helvetica,sans-serif;color:#2C1503;">
          <tr>
            <td align="center" style="padding:4px 0 18px;">
              <span style="font-size:20px;font-weight:bold;letter-spacing:3px;color:#2C1503;">{{ shop_name|upper }}</span>
            </td>
          </tr>
          <tr>
            <td style="background:#ffffff;border-radius:16px;padding:28px;">
              {% block content %}{% endblock %}
            </td>
          </tr>
          <tr>
            <td align="center" style="padding:20px 8px 4px;font-size:12px;line-height:1.6;color:#9ca3af;">
              {{ shop_name }} · {{ shop_address }}<br>
              {% if shop_phone %}{{ shop_phone }}{% if shop_email %} · {% endif %}{% endif %}{% if shop_email %}<a href="mailto:{{ shop_email }}" style="color:#9ca3af;">{{ shop_email }}</a>{% endif %}
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
